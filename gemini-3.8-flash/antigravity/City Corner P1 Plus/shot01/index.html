<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>雨夜のコンビニ 24H · Rainy Night Corner Diorama</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060913;
      cursor: grab;
    }
    body:active {
      cursor: grabbing;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>
  <script src="./three.min.js"></script>
  <script>if (typeof THREE === 'undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
  <script src="./OrbitControls.js"></script>
  <script>if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls === 'undefined') document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>');</script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <script>
  (function() {
    'use strict';

    // -------------------------------------------------------------------------
    // 1. 初始化场景、摄像机与电影级三渲二管线
    // -------------------------------------------------------------------------
    const canvas = document.getElementById('webgl-canvas');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060914);
    scene.fog = new THREE.FogExp2(0x0a101f, 0.016);

    const camera = new THREE.PerspectiveCamera(34, width / height, 0.1, 1000);
    // 经典微缩模型透视：从街角路口斜上方俯瞰便利店与双向街道全貌
    camera.position.set(-11.2, 14.2, 20.2);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0.6, 1.0, -0.6);
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minDistance = 4.5;
    controls.maxDistance = 38.0;

    // -------------------------------------------------------------------------
    // 2. 高精度程序化日系动漫贴图生成器 (将斑马线与路面标线直接融合绘制，杜绝Z-fighting)
    // -------------------------------------------------------------------------
    const TextureGen = {
      // 柔和卡通色阶 (Cel Ramp)
      createToonRamp() {
        const c = document.createElement('canvas');
        c.width = 4;
        c.height = 1;
        const ctx = c.getContext('2d');
        const colors = ['#283548', '#4b5e78', '#7b93b2', '#c5d8ee'];
        for (let i = 0; i < 4; i++) {
          ctx.fillStyle = colors[i];
          ctx.fillRect(i, 0, 1, 1);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.minFilter = THREE.NearestFilter;
        tex.magFilter = THREE.NearestFilter;
        tex.wrapS = THREE.ClampToEdgeWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        return tex;
      },

      // 整体道路与街角全景贴图 (规范日式横断歩道、停止线、菱形标线、とまれ大字、积水倒影)
      createStreetCornerTexture() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 1024;
        const ctx = c.getContext('2d');

        // 1. 纯正日漫深蓝灰色湿润沥青路面底色
        ctx.fillStyle = '#161e2a';
        ctx.fillRect(0, 0, 1024, 1024);

        // 细腻沥青颗粒噪点
        for (let i = 0; i < 30000; i++) {
          const x = Math.random() * 1024;
          const y = Math.random() * 1024;
          const bright = Math.random() * 16;
          ctx.fillStyle = `rgb(${22 + bright}, ${30 + bright}, ${42 + bright})`;
          ctx.fillRect(x, y, 1.5, 1.5);
        }

        // 2. 真实自然的雨夜湿润水痕与积水倒影 (柔和融入路面，杜绝突兀黑洞)
        const puddles = [
          { x: 300, y: 720, rx: 90, ry: 55, col: 'rgba(28, 52, 72, 0.45)' }, // 街角近水洼 (倒映冷青路灯)
          { x: 740, y: 820, rx: 110, ry: 60, col: 'rgba(56, 48, 32, 0.4)' },  // 车道水洼 (倒映便利店暖光)
          { x: 180, y: 460, rx: 80, ry: 50, col: 'rgba(24, 42, 60, 0.4)' },  // 左侧道路水洼
          { x: 480, y: 920, rx: 100, ry: 55, col: 'rgba(38, 42, 50, 0.35)' }  // 斑马线远侧微积水
        ];
        puddles.forEach(p => {
          const grad = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, p.rx);
          grad.addColorStop(0, p.col);
          grad.addColorStop(0.7, 'rgba(18, 24, 34, 0.3)');
          grad.addColorStop(1, 'rgba(22, 30, 42, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.rx, p.ry, Math.PI / 12, 0, Math.PI * 2);
          ctx.fill();
        });

        // 3. 正规日式斑马线 (横断歩道)：
        // 核心准则：白色条纹必须【平行于车辆行驶方向】！行人横穿条纹行走！
        ctx.fillStyle = '#f0f5fc';

        // [前侧斑马线]：车辆沿横向(X)行驶，故斑马线条纹为【水平横条】！
        // 斑马线宽度（沿X方向跨度）：190px (约 3.7 米通道)
        // 斑马线长度（沿Y方向跨度）：行人从人行道切口(y=680)跨越到对侧(y=930)
        // 条纹粗细：23px (约 45cm)，间隔：23px (约 45cm)
        const fCrossX = 430;
        const fCrossW = 190;
        for (let i = 0; i < 6; i++) {
          const sy = 680 + i * 46;
          ctx.fillRect(fCrossX, sy, fCrossW, 23);
        }

        // [左侧斑马线]：车辆沿纵向(Y)行驶，故斑马线条纹为【垂直竖条】！
        // 斑马线宽度（沿Y方向跨度）：190px (约 3.7 米通道)
        // 斑马线长度（沿X方向跨度）：行人从人行道切口(x=350)跨越到对侧(x=100)
        // 条纹粗细：23px (约 45cm)，间隔：23px (约 45cm)
        const lCrossY = 410;
        const lCrossH = 190;
        for (let i = 0; i < 6; i++) {
          const sx = 100 + i * 46;
          ctx.fillRect(sx, lCrossY, 23, lCrossH);
        }

        // 4. 白色停止线 (Stop Lines)：横跨驶入路口的受控车道，距斑马线约 1.5 米
        ctx.fillStyle = '#f0f5fc';
        // 前侧车道停止线 (来车由右向左驶入，位于南侧车道 y: 780~960，在斑马线前 x: 650)
        ctx.fillRect(650, 780, 16, 180);
        // 左侧车道停止线 (来车由上向下驶入，位于西侧车道 x: 80~260，在斑马线前 y: 380)
        ctx.fillRect(80, 380, 180, 16);

        // 5. 日式路面菱形行人过街预告标线 ("◇")：提示前有横断步道
        ctx.strokeStyle = '#f0f5fc';
        ctx.lineWidth = 7;
        // 前侧车道菱形 (位于停止线前方的来车道中心 x=740, y=860)
        ctx.beginPath();
        ctx.moveTo(740, 830);
        ctx.lineTo(765, 860);
        ctx.lineTo(740, 890);
        ctx.lineTo(715, 860);
        ctx.closePath();
        ctx.stroke();

        // 左侧车道菱形 (位于停止线前方的来车道中心 x=170, y=280)
        ctx.beginPath();
        ctx.moveTo(170, 250);
        ctx.lineTo(195, 280);
        ctx.lineTo(170, 310);
        ctx.lineTo(145, 280);
        ctx.closePath();
        ctx.stroke();

        // 6. 白色路面“とまれ (STOP)”标字：
        // 按照日本交通规范，文字沿车道方向书写，正迎面朝向驾驶员视野
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#f0f5fc';
        ctx.font = 'bold 44px "Hiragino Sans", "Meiryo", sans-serif';

        // 前侧车道：文字竖排在来车道中心 (x = 830)，正迎面朝向俯瞰视角
        ctx.fillText('と', 830, 805);
        ctx.fillText('ま', 830, 860);
        ctx.fillText('れ', 830, 915);

        // 左侧车道：文字竖排在来车道中心 (x = 170)
        ctx.fillText('と', 170, 150);
        ctx.fillText('ま', 170, 200);
        ctx.fillText('れ', 170, 250);

        // 7. 车道中心白实线与路侧边缘线
        ctx.strokeStyle = 'rgba(240, 245, 252, 0.65)';
        ctx.lineWidth = 5;
        // 前侧车道边缘线
        ctx.beginPath();
        ctx.moveTo(650, 970);
        ctx.lineTo(1024, 970);
        ctx.stroke();

        const tex = new THREE.CanvasTexture(c);
        tex.anisotropy = 4;
        return tex;
      },

      // 人行道地砖贴图
      createSidewalkTiles() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#3a4555';
        ctx.fillRect(0, 0, 512, 512);

        const size = 64;
        ctx.strokeStyle = '#28313e';
        ctx.lineWidth = 3;

        for (let x = 0; x < 512; x += size) {
          for (let y = 0; y < 512; y += size) {
            const tone = (Math.random() - 0.5) * 8;
            ctx.fillStyle = `rgb(${56 + tone}, ${66 + tone}, ${80 + tone})`;
            ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
            ctx.strokeRect(x, y, size, size);
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(5, 5);
        return tex;
      },

      // 外墙白色长条面砖
      createWallTiles() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#dde5ee';
        ctx.fillRect(0, 0, 512, 512);

        ctx.strokeStyle = '#bac7d6';
        ctx.lineWidth = 2;
        const th = 28;
        const tw = 56;

        for (let y = 0; y < 512; y += th) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(512, y);
          ctx.stroke();

          const offset = ((y / th) % 2) * (tw / 2);
          for (let x = -tw; x < 512 + tw; x += tw) {
            ctx.beginPath();
            ctx.moveTo(x + offset, y);
            ctx.lineTo(x + offset, y + th);
            ctx.stroke();
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(3, 2);
        return tex;
      },

      // 正面主发光招牌
      createMainSign() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 256;
        const ctx = c.getContext('2d');

        ctx.fillStyle = '#063456';
        ctx.fillRect(0, 0, 1024, 256);

        ctx.fillStyle = '#00a0e9';
        ctx.fillRect(0, 10, 1024, 26);
        ctx.fillStyle = '#00cc7a';
        ctx.fillRect(0, 220, 1024, 26);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillStyle = '#ffea75';
        ctx.beginPath();
        ctx.arc(165, 128, 52, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#063456';
        ctx.beginPath();
        ctx.arc(165, 128, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffea75';
        ctx.font = 'bold 36px sans-serif';
        ctx.fillText('蛍', 165, 130);

        ctx.fillStyle = '#ffffff';
        ctx.font = '900 78px "Helvetica Neue", "Arial Black", sans-serif';
        ctx.shadowColor = '#00e1ff';
        ctx.shadowBlur = 16;
        ctx.fillText('HOTARU MART', 535, 115);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#c5f5ff';
        ctx.font = 'bold 30px "Hiragino Sans", sans-serif';
        ctx.fillText('ホタルマート  ·  24時間営業  年中無休', 535, 180);

        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.roundRect(875, 75, 105, 105, 12);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 42px sans-serif';
        ctx.fillText('24', 927, 115);
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('OPEN', 927, 152);

        return new THREE.CanvasTexture(c);
      },

      // 侧面凸出立式灯箱
      createSideSign() {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#063456';
        ctx.fillRect(0, 0, 256, 512);

        ctx.fillStyle = '#00a0e9';
        ctx.fillRect(12, 12, 232, 488);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(22, 22, 212, 468);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.arc(128, 90, 48, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.fillText('24', 128, 88);

        ctx.fillStyle = '#063456';
        ctx.font = 'bold 44px "Hiragino Sans", sans-serif';
        ctx.fillText('蛍', 128, 180);
        ctx.fillText('マ', 128, 235);
        ctx.fillText('｜', 128, 285);
        ctx.fillText('ト', 128, 335);

        ctx.fillStyle = '#0085d0';
        ctx.font = 'bold 26px sans-serif';
        ctx.fillText('酒·たばこ', 128, 410);
        ctx.fillText('ATM·銀行', 128, 452);

        return new THREE.CanvasTexture(c);
      },

      // 自动贩卖机面板
      createVendingFront(type = 'red') {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 768;
        const ctx = c.getContext('2d');

        const base = type === 'red' ? '#c0292b' : '#1b7e46';
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, 512, 768);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(25, 20, 462, 95);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = base;
        ctx.font = '900 40px sans-serif';
        ctx.fillText(type === 'red' ? 'REFRESH DRINKS' : 'NATURAL GREEN TEA', 256, 68);

        ctx.fillStyle = '#ebf5fa';
        ctx.fillRect(25, 135, 462, 345);
        ctx.strokeStyle = '#8da0b3';
        ctx.lineWidth = 4;
        ctx.strokeRect(25, 135, 462, 345);

        const rowColors = [
          ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22'],
          ['#1abc9c', '#d35400', '#2c3e50', '#e74c3c', '#f39c12', '#27ae60'],
          ['#2980b9', '#8e44ad', '#16a085', '#c0392b', '#7f8c8d', '#d35400']
        ];

        for (let r = 0; r < 3; r++) {
          const y = 155 + r * 105;
          ctx.fillStyle = '#bdc8d4';
          ctx.fillRect(30, y + 70, 452, 6);

          for (let col = 0; col < 6; col++) {
            const x = 50 + col * 72;
            ctx.fillStyle = rowColors[r][col];
            ctx.beginPath();
            ctx.roundRect(x, y, 42, 65, 6);
            ctx.fill();

            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.fillRect(x + 5, y + 4, 8, 57);

            ctx.fillStyle = (r === 1 && col < 3) ? '#e74c3c' : '#2980b9';
            ctx.fillRect(x + 8, y + 78, 26, 12);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText((r === 1 && col < 3) ? 'HOT' : 'COLD', x + 21, y + 84);
          }
        }

        ctx.fillStyle = '#222d3b';
        ctx.fillRect(320, 500, 165, 110);
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 22px monospace';
        ctx.fillText('¥160', 400, 532);

        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(350, 560, 32, 6);
        ctx.fillRect(425, 555, 12, 16);

        ctx.fillStyle = '#141820';
        ctx.fillRect(40, 630, 432, 110);
        ctx.fillStyle = '#273142';
        ctx.fillRect(48, 638, 416, 94);
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('PUSH  お取出し口', 256, 685);

        return new THREE.CanvasTexture(c);
      },

      // 饮料冷柜贴图
      createChillerDoors() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#101726';
        ctx.fillRect(0, 0, 1024, 512);

        const doorW = 1024 / 4;
        for (let d = 0; d < 4; d++) {
          const dx = d * doorW;
          ctx.strokeStyle = '#47566d';
          ctx.lineWidth = 8;
          ctx.strokeRect(dx + 4, 4, doorW - 8, 504);

          const grad = ctx.createLinearGradient(dx, 0, dx, 512);
          grad.addColorStop(0, '#eaf5ff');
          grad.addColorStop(1, '#a6cde9');
          ctx.fillStyle = grad;
          ctx.fillRect(dx + 8, 8, doorW - 16, 496);

          for (let shelf = 0; shelf < 5; shelf++) {
            const sy = 40 + shelf * 95;
            ctx.fillStyle = '#b7c6d6';
            ctx.fillRect(dx + 10, sy + 65, doorW - 20, 5);

            for (let b = 0; b < 10; b++) {
              const bx = dx + 16 + b * 22;
              let col = '#3498db';
              if (d === 0) col = ['#27ae60', '#2ecc71', '#16a085', '#1abc9c'][b % 4];
              else if (d === 1) col = ['#3498db', '#2980b9', '#74b9ff', '#0984e3'][b % 4];
              else if (d === 2) col = ['#e74c3c', '#d63031', '#ff7675', '#e17055'][b % 4];
              else col = ['#f1c40f', '#f39c12', '#ffeaa7', '#fdcb6e'][b % 4];

              ctx.fillStyle = col;
              ctx.beginPath();
              ctx.roundRect(bx, sy + 5, 16, 58, 3);
              ctx.fill();
              ctx.fillStyle = 'rgba(255,255,255,0.45)';
              ctx.fillRect(bx + 2, sy + 7, 4, 52);
            }
          }

          ctx.fillStyle = '#64748b';
          ctx.fillRect(dx + doorW - 22, 180, 8, 140);
        }
        return new THREE.CanvasTexture(c);
      },

      // 双面货架贴图
      createSnackShelf() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#f1f5f9';
        ctx.fillRect(0, 0, 512, 256);

        for (let tier = 0; tier < 3; tier++) {
          const ty = 10 + tier * 80;
          ctx.fillStyle = '#cbd5e1';
          ctx.fillRect(0, ty + 65, 512, 6);

          ctx.fillStyle = '#ef4444';
          for (let p = 0; p < 8; p++) {
            ctx.fillRect(20 + p * 62, ty + 69, 18, 4);
          }

          for (let item = 0; item < 12; item++) {
            const ix = 10 + item * 41;
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
            ctx.fillStyle = colors[(item + tier * 3) % colors.length];

            if (tier === 1) {
              ctx.beginPath();
              ctx.moveTo(ix + 2, ty + 12);
              ctx.lineTo(ix + 32, ty + 12);
              ctx.lineTo(ix + 28, ty + 62);
              ctx.lineTo(ix + 6, ty + 62);
              ctx.closePath();
              ctx.fill();
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(ix + 4, ty + 12, 26, 6);
            } else {
              ctx.beginPath();
              ctx.roundRect(ix + 2, ty + 8, 30, 54, 5);
              ctx.fill();
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(ix + 6, ty + 25, 22, 16);
            }
          }
        }
        return new THREE.CanvasTexture(c);
      },

      // 便当与饭团贴图
      createBentoIsland() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, 512, 256);

        for (let i = 0; i < 8; i++) {
          const ox = 15 + i * 60;
          if (i % 2 === 0) {
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.moveTo(ox + 22, 20);
            ctx.lineTo(ox + 44, 75);
            ctx.lineTo(ox, 75);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(ox + 13, 50, 18, 25);
          } else {
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.moveTo(ox + 10, 20);
            ctx.lineTo(ox + 48, 75);
            ctx.lineTo(ox + 10, 75);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(ox + 18, 45, 16, 5);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(ox + 18, 52, 16, 5);
          }
        }

        ctx.fillStyle = '#475569';
        ctx.fillRect(0, 95, 512, 8);

        for (let b = 0; b < 6; b++) {
          const bx = 15 + b * 82;

      // 玻璃水流流痕
      createRainGlassTexture() {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 1024;
        const ctx = c.getContext('2d');
        ctx.fillStyle = 'rgba(0, 0, 0, 0)';
        ctx.fillRect(0, 0, 512, 1024);

        for (let i = 0; i < 50; i++) {
          const x = Math.random() * 512;
          const y = Math.random() * 1024;
          const h = 40 + Math.random() * 120;
          const w = 1.2 + Math.random() * 1.6;

          const grad = ctx.createLinearGradient(x, y, x, y + h);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
          grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.3)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0.75)');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(x, y + h, w * 1.2, w * 1.5, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = w;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + h);
          ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1.5, 1.5);
        return tex;
      }

      [-2.2, sidewalkH + 0.4, 1.4],   // 拐角左侧护栏
      [-2.2, sidewalkH + 0.4, 2.55],  // 街角正顶点
      [-1.8, sidewalkH + 0.4, 2.55],  // 拐角前侧圆弧
      [2.35, sidewalkH + 0.4, 2.55]   // 斑马线右侧/自行车停放保护柱
    ];
    bollardPos.forEach(pos => {
      const bollard = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 12), bollardMat);
      bollard.position.set(pos[0], pos[1], pos[2]);
      streetProps.add(bollard);
      MatLib.createEdges(bollard, 0x241804);
    });

    // [街角9]：倒三角“止まれ”停止牌
    const signGroup = new THREE.Group();
    signGroup.position.set(-0.9, 0, 2.55);
    streetProps.add(signGroup);

    const signPole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 3.6, 8), MatLib.createToon(0x94a3b8));
    signPole.position.y = 1.8;
    signGroup.add(signPole);

    const triangleShape = new THREE.Shape();
    triangleShape.moveTo(-0.38, 0.32);
    triangleShape.lineTo(0.38, 0.32);
    triangleShape.lineTo(0, -0.38);
    triangleShape.closePath();
    const triMesh = new THREE.Mesh(new THREE.ShapeGeometry(triangleShape), new THREE.MeshBasicMaterial({ color: 0xd90429, side: THREE.DoubleSide }));
    triMesh.position.set(0, 3.3, 0.02);
    triMesh.rotation.y = Math.PI / 4;
    signGroup.add(triMesh);

    // [街角10]：行人过街信号灯
    const trafficGroup = new THREE.Group();
    trafficGroup.position.set(-2.2, 0, 2.55);
    streetProps.add(trafficGroup);

    const trafficPole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 4.0, 10), MatLib.createToon(0x334155));
    trafficPole.position.y = 2.0;
    trafficGroup.add(trafficPole);

    const tBox = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.6, 0.2), MatLib.createToon(0x1e293b));
    tBox.position.set(0, 3.5, 0);
    trafficGroup.add(tBox);

    const tLightGeo = new THREE.SphereGeometry(0.075, 12, 12);
    const tRedMat = new THREE.MeshBasicMaterial({ color: 0x330000 });
    const tRedLight = new THREE.Mesh(tLightGeo, tRedMat);
    tRedLight.position.set(0, 3.65, 0.11);
    trafficGroup.add(tRedLight);

    const tGreenMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa });
    const tGreenLight = new THREE.Mesh(tLightGeo, tGreenMat);
    tGreenLight.position.set(0, 3.35, 0.11);
    trafficGroup.add(tGreenLight);

    // [街角11]：社区公告栏
    const noticeBoard = new THREE.Mesh(
      new THREE.PlaneGeometry(1.8, 1.0),
      new THREE.MeshBasicMaterial({ map: TextureGen.createNoticeBoard() })
    );
    noticeBoard.position.set(-STORE_W / 2 + STORE_X - 0.14, sidewalkH + 2.0, -1.5);
    noticeBoard.rotation.y = Math.PI / 2;
    streetProps.add(noticeBoard);

    // [街角12]：深邃侧巷与黄色周转箱
    const alleyGroup = new THREE.Group();
    alleyGroup.position.set(STORE_X + STORE_W / 2 + 0.7, sidewalkH, -2.4);
    streetProps.add(alleyGroup);

    const crateMat = MatLib.createToon(0xf59e0b);
    for (let c = 0; c < 5; c++) {
      const crate = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.32, 0.55), crateMat);
      crate.position.set((c > 2 ? 0.4 : -0.2), 0.16 + (c % 3) * 0.34, 0);
      alleyGroup.add(crate);
      MatLib.createEdges(crate, 0x1f1402);
    }

    const alleyLamp = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffaa44 }));
    alleyLamp.position.set(-0.6, 2.0, -0.3);
    alleyGroup.add(alleyLamp);

    // -------------------------------------------------------------------------
    // 11. 雨夜动态效果系统 (细腻半透明薄纱降雨、水洼波纹、屋檐水滴、玻璃流痕)
    // -------------------------------------------------------------------------
    // 细腻极细半透明雨丝 (1500 根，薄纱般优雅)
    const RAIN_COUNT = 1500;
    const rainGeo = new THREE.BufferGeometry();
    const rainPositions = new Float32Array(RAIN_COUNT * 6);
    const rainVelocities = new Float32Array(RAIN_COUNT);

    const RAIN_BOUND_XZ = BASE_SIZE * 0.65;
    const RAIN_TOP = 16.0;
    const RAIN_BOTTOM = 0.0;
    const RAIN_LENGTH = 0.5;
    const WIND_DRIFT = -0.045;

    for (let i = 0; i < RAIN_COUNT; i++) {
      const x = (Math.random() - 0.5) * RAIN_BOUND_XZ * 2;
      const y = Math.random() * (RAIN_TOP - RAIN_BOTTOM) + RAIN_BOTTOM;
      const z = (Math.random() - 0.5) * RAIN_BOUND_XZ * 2;

      rainPositions[i * 6 + 0] = x;
      rainPositions[i * 6 + 1] = y;
      rainPositions[i * 6 + 2] = z;
      rainPositions[i * 6 + 3] = x + WIND_DRIFT;
      rainPositions[i * 6 + 4] = y - RAIN_LENGTH;
      rainPositions[i * 6 + 5] = z;

      rainVelocities[i] = 0.32 + Math.random() * 0.22;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
    const rainMat = new THREE.LineBasicMaterial({
      color: 0x82a6cc,
      transparent: true,
      opacity: 0.2,
      blending: THREE.AdditiveBlending
    });
    const rainLines = new THREE.LineSegments(rainGeo, rainMat);
    scene.add(rainLines);

    // 地面积水涟漪同心圆
    const RIPPLE_COUNT = 18;
    const rippleGroup = new THREE.Group();
    scene.add(rippleGroup);

    const rippleGeo = new THREE.RingGeometry(0.04, 0.07, 24);
    rippleGeo.rotateX(-Math.PI / 2);
    const ripples = [];

    for (let r = 0; r < RIPPLE_COUNT; r++) {
      const ripMesh = new THREE.Mesh(
        rippleGeo,
        new THREE.MeshBasicMaterial({ color: 0x90b5df, transparent: true, opacity: 0.0, side: THREE.DoubleSide })
      );
      rippleGroup.add(ripMesh);
      ripples.push({
        mesh: ripMesh,
        active: false,
        timer: Math.random() * 3,
        scale: 0.1,
        maxScale: 0.7 + Math.random() * 0.5,
        x: (Math.random() - 0.5) * (BASE_SIZE - 4),
        z: (Math.random() - 0.5) * (BASE_SIZE - 4),
        y: 0.04
      });
    }

    // 屋檐水滴
    const DRIP_COUNT = 12;
    const drips = [];
    const dripMat = new THREE.MeshBasicMaterial({ color: 0xd8ebff, transparent: true, opacity: 0.75 });
    const dripGeo = new THREE.SphereGeometry(0.025, 6, 6);

    for (let d = 0; d < DRIP_COUNT; d++) {
      const dripMesh = new THREE.Mesh(dripGeo, dripMat);
      scene.add(dripMesh);
      drips.push({
        mesh: dripMesh,
        x: STORE_X - 3.8 + (d / DRIP_COUNT) * 7.6,
        y: STORE_Y + STORE_H + 0.1,
        z: STORE_Z + STORE_D / 2 + CANOPY_PROJ,
        velocityY: 0.03 + Math.random() * 0.03,
        delay: Math.random() * 2.5
      });
    }

    // -------------------------------------------------------------------------
    // 12. 动效控制器与核心渲染主循环 (Animation Controller & Render Loop)
    // -------------------------------------------------------------------------
    let clock = new THREE.Clock();
    let autoDoorTimer = 0;
    let autoDoorState = 'closed';
    let autoDoorProgress = 0;

    let trafficTimer = 0;
    let trafficIsGreen = true;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      controls.update();

      // 雨丝柔和下落
      const posAttr = rainGeo.attributes.position;
      const posArr = posAttr.array;
      for (let i = 0; i < RAIN_COUNT; i++) {
        const v = rainVelocities[i];
        posArr[i * 6 + 1] -= v;
        posArr[i * 6 + 4] -= v;
        posArr[i * 6 + 0] += WIND_DRIFT * 0.1;
        posArr[i * 6 + 3] += WIND_DRIFT * 0.1;

        if (posArr[i * 6 + 1] < RAIN_BOTTOM) {
          const rx = (Math.random() - 0.5) * RAIN_BOUND_XZ * 2;
          const rz = (Math.random() - 0.5) * RAIN_BOUND_XZ * 2;
          posArr[i * 6 + 0] = rx;
          posArr[i * 6 + 1] = RAIN_TOP;
          posArr[i * 6 + 2] = rz;
          posArr[i * 6 + 3] = rx + WIND_DRIFT;
          posArr[i * 6 + 4] = RAIN_TOP - RAIN_LENGTH;
          posArr[i * 6 + 5] = rz;
        }
      }
      posAttr.needsUpdate = true;

      // 玻璃表面雨水流动
      rainGlassTex.offset.y -= delta * 0.14;

      // 地面水洼涟漪
      ripples.forEach(rip => {
        rip.timer -= delta;
        if (rip.timer <= 0) {
          if (!rip.active) {
            rip.active = true;
            rip.scale = 0.1;
            rip.x = (Math.random() - 0.5) * (BASE_SIZE - 4.5);
            rip.z = (Math.random() - 0.5) * (BASE_SIZE - 4.5);
            rip.mesh.position.set(rip.x, rip.y, rip.z);
          }

          rip.scale += delta * 1.25;
          rip.mesh.scale.set(rip.scale, rip.scale, rip.scale);
          const life = rip.scale / rip.maxScale;
          rip.mesh.material.opacity = Math.max(0, (1 - life) * 0.45);

          if (rip.scale >= rip.maxScale) {
            rip.active = false;
            rip.mesh.material.opacity = 0;
            rip.timer = 0.8 + Math.random() * 2.5;
          }
        }
      });

      // 屋檐滴水
      drips.forEach(d => {
        if (d.delay > 0) {
          d.delay -= delta;
          d.mesh.position.set(d.x, d.y, d.z);
        } else {
          d.mesh.position.y -= d.velocityY;
          d.velocityY += 0.007;
          if (d.mesh.position.y <= sidewalkH + 0.04) {
            d.mesh.position.y = d.y;
            d.velocityY = 0.03 + Math.random() * 0.03;
            d.delay = 0.5 + Math.random() * 2.5;
          }
        }
      });

      // 关东煮白汽烟雾
      steamParticles.forEach(sp => {
        sp.age += delta;
        if (sp.age > sp.maxLife) {
          sp.age = 0;
          sp.mesh.position.set((Math.random() - 0.5) * 0.3, 0, (Math.random() - 0.5) * 0.4);
          sp.mesh.scale.set(0.6, 0.6, 0.6);
        } else {
          sp.mesh.position.y += delta * sp.speedY;
          sp.mesh.position.x += Math.sin(elapsed * 2.0 + sp.age) * delta * 0.05;
          const prog = sp.age / sp.maxLife;
          const sc = 0.6 + prog * 1.5;
          sp.mesh.scale.set(sc, sc, sc);
          sp.mesh.material.opacity = Math.sin(prog * Math.PI) * 0.25;
        }
      });

      // 自动移门开合
      autoDoorTimer += delta;
      if (autoDoorState === 'closed' && autoDoorTimer > 8.0) {
        autoDoorState = 'opening';
        autoDoorTimer = 0;
      } else if (autoDoorState === 'opening') {
        autoDoorProgress += delta * 0.95;
        if (autoDoorProgress >= 1.0) {
          autoDoorProgress = 1.0;
          autoDoorState = 'open';
          autoDoorTimer = 0;
        }
      } else if (autoDoorState === 'open' && autoDoorTimer > 3.0) {
        autoDoorState = 'closing';
        autoDoorTimer = 0;
      } else if (autoDoorState === 'closing') {
        autoDoorProgress -= delta * 0.95;
        if (autoDoorProgress <= 0.0) {
          autoDoorProgress = 0.0;
          autoDoorState = 'closed';
          autoDoorTimer = 0;
        }
      }
      const easeProgress = autoDoorProgress * autoDoorProgress * (3 - 2 * autoDoorProgress);
      doorLeftGroup.position.x = -0.4 - easeProgress * 0.9;
      doorRightGroup.position.x = 0.65 + easeProgress * 0.9;

      // 空调外机风扇转动
      acFan.rotation.x += delta * 14.0;

      // 招牌微弱霓虹呼吸
      const neonFlicker = 0.96 + Math.sin(elapsed * 4.5) * 0.04 + (Math.random() < 0.015 ? -0.1 : 0);
      mainSignMat.emissiveIntensity = 0.95 * neonFlicker;
      sideSignMat.emissiveIntensity = 0.8 * neonFlicker;

      // 交通信号灯慢节奏交替
      trafficTimer += delta;
      if (trafficTimer > 12.0) {
        trafficTimer = 0;
        trafficIsGreen = !trafficIsGreen;
      }
      if (trafficIsGreen) {
        const blink = (trafficTimer > 9.5 && Math.sin(elapsed * 12) > 0);
        tGreenMat.color.setHex(blink ? 0x003311 : 0x00ff99);
        tRedMat.color.setHex(0x330000);
      } else {
        tGreenMat.color.setHex(0x003311);
        tRedMat.color.setHex(0xff2222);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', function() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

  })();
  </script>
</body>
</html>
