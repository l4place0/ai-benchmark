<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rainy Corner — Miniature</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0c0e18; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.4s ease; cursor: grab; touch-action: none; }
  #c.on { opacity: 1; }
  #c:active { cursor: grabbing; }
  #vig { position: fixed; inset: 0; pointer-events: none;
         background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(4,5,11,0.5) 100%); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<script src="./three.min.js"></script>
<script src="./main.js"></script>
</body>
</html>
